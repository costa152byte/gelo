{% extends 'base.html' %}

{% block title %}Confirmar Exclusão - Artgelo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 2.5rem;"></i>
                <h1 class="h4 my-3">Confirmar Exclusão</h1>
                <p>
                    Tem certeza que deseja remover o membro
                    <strong>{{ object.nome_completo }}</strong>?
                    Esta ação não pode ser desfeita.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'membros:listar_membro' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sim, excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
